# Reference config for the API on Render's free plan.
# Create it by hand (New → Web Service) with these settings — Blueprints need a paid workspace.
# The frontend is deployed on Vercel (free); see README → Deploy.
services:
  - type: web
    name: vastra-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://vastra.algearithm.xyz
      - key: PUBLIC_API_URL
        value: https://api.algearithm.xyz
      - key: HINDSIGHT_API_URL
        value: https://api.hindsight.vectorize.io
      - key: GROQ_MODEL_MAIN
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM_NAME
        value: Vastra Support
      - key: RESEND_FROM
        value: support@algearithm.xyz
      - key: TWILIO_WHATSAPP_FROM
        value: whatsapp:+14155238886
      - key: TWILIO_VOICE_ENABLED
        value: "false"
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"
      # secrets — copy the values from backend/.env
      - { key: DATABASE_URL, sync: false }
      - { key: HINDSIGHT_API_KEY, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: CLOUDINARY_CLOUD_NAME, sync: false }
      - { key: CLOUDINARY_API_KEY, sync: false }
      - { key: CLOUDINARY_API_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: BOOTSTRAP_ADMIN_EMAIL, sync: false }
      - { key: BOOTSTRAP_ADMIN_NAME, sync: false }
      - { key: BOOTSTRAP_ADMIN_PASSWORD, sync: false }
